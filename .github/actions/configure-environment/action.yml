name: 'Configure environment'
description: 'Configure CI, cache and container name environment variables'
runs:
  using: 'composite'
  steps:
    - name: Set CI and cache directories
      shell: bash
      run: |
        echo "BASE_ROOT_DIR=${{ runner.temp }}" >> "$GITHUB_ENV"
        echo "BASE_BUILD_DIR=${{ runner.temp }}/build" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=${{ runner.temp }}/ccache_dir" >> $GITHUB_ENV
        echo "DEPENDS_DIR=${{ runner.temp }}/depends" >> "$GITHUB_ENV"
        echo "BASE_CACHE=${{ runner.temp }}/depends/built" >> $GITHUB_ENV
        echo "SOURCES_PATH=${{ runner.temp }}/depends/sources" >> $GITHUB_ENV
        echo "PREVIOUS_RELEASES_DIR=${{ runner.temp }}/previous_releases" >> $GITHUB_ENV

    - name: Set cache hashes
      shell: bash
      run: |
        echo "DEPENDS_HASH=$(git ls-tree HEAD depends "$FILE_ENV" | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
        echo "PREVIOUS_RELEASES_HASH=$(git ls-tree HEAD test/get_previous_releases.py | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

    - name: Get container name
      shell: bash
      run: |
        source $FILE_ENV
        echo "CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"

    # runner.temp is a fresh directory for every job, and the cache actions
    # only save on pushes to the default branch, so a self-hosted runner would
    # otherwise start every job cold. When the repository variable
    # CI_PERSISTENT_CACHE_DIR names a directory on the runner host, keep
    # ccache, depends and previous releases there across jobs instead.
    - name: Use persistent cache directories
      if: ${{ runner.environment == 'self-hosted' && vars.CI_PERSISTENT_CACHE_DIR != '' }}
      shell: bash
      env:
        CACHE_ROOT: ${{ vars.CI_PERSISTENT_CACHE_DIR }}
      run: |
        set -euo pipefail
        # Only a host that opted in by creating the directory uses it; other
        # self-hosted runners (e.g. hosted agents that report themselves as
        # self-hosted) keep the default per-job directories.
        if [ ! -d "$CACHE_ROOT" ] || [ ! -w "$CACHE_ROOT" ]; then
          echo "::notice title=Persistent cache::$CACHE_ROOT is not a writable directory on this runner; using per-job cache directories"
          exit 0
        fi
        # Built depends packages contain absolute paths of the depends prefix
        # (e.g. in their CMake config files), and ccache only hits when paths
        # match, so the caches need the same root directory in every run. Use
        # one root per container: the container name is unique per job
        # configuration. This assumes a host runs one job of a given
        # configuration at a time, which the fixed container name already
        # requires.
        root="$CACHE_ROOT/work/$CONTAINER_NAME"
        # The build directory is kept too, so a run builds incrementally on top
        # of the previous one with the same configuration. (The container
        # writes it as root, so it can't be removed from here anyway.)
        mkdir -p "$root/depends" "$CACHE_ROOT/depends-sources" "$CACHE_ROOT/previous-releases"
        # Sources and previous releases don't depend on the path or the job, so
        # share them. The CI script bind-mounts these paths into the container;
        # Docker resolves the symlinks on the host.
        ln -sfn "$CACHE_ROOT/depends-sources" "$root/depends/sources"
        ln -sfn "$CACHE_ROOT/previous-releases" "$root/previous_releases"
        {
          echo "BASE_ROOT_DIR=$root"
          echo "BASE_BUILD_DIR=$root/build"
          echo "CCACHE_DIR=$root/ccache_dir"
          echo "DEPENDS_DIR=$root/depends"
          echo "BASE_CACHE=$root/depends/built"
          echo "SOURCES_PATH=$root/depends/sources"
          echo "PREVIOUS_RELEASES_DIR=$root/previous_releases"
          echo "CI_PERSISTENT_CACHE=true"
        } >> "$GITHUB_ENV"
        echo "Using persistent root $root"

    # The Buildkite runner creates a new runner.temp and workspace directory for
    # every job under the agent's TMPDIR and doesn't remove them afterwards,
    # which fills the disk of a persistent host within days. Remove the ones
    # left by earlier jobs. A job can't safely remove its own at the end,
    # because post steps of actions still use it, so do it at the start of the
    # next job instead. Only touch directories that haven't changed for longer
    # than any job may run (timeout-minutes is at most 240), so directories of
    # jobs still running on other agents of the same host are kept.
    - name: Remove directories of earlier jobs
      if: ${{ env.CI_PERSISTENT_CACHE == 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        own_temp="$(realpath "$RUNNER_TEMP")"
        own_workspace="$(realpath "$GITHUB_WORKSPACE")"
        for parent in "$(dirname "$own_temp")" "$(dirname "$own_workspace")"; do
          find "$parent" -mindepth 1 -maxdepth 1 -type d -name 'buildkite-gha-*' -mmin +360 -print0
        done | sort -zu | while IFS= read -r -d '' dir; do
          dir="$(realpath "$dir")"
          if [ "$dir" = "$own_temp" ] || [ "$dir" = "$own_workspace" ]; then
            continue
          fi
          echo "Removing $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
          # CI containers run as root, so files they wrote may not be removable
          # by the runner user.
          rm -rf "$dir" 2>/dev/null || sudo -n rm -rf "$dir" || echo "::warning title=Cleanup::Could not remove $dir"
        done
        df -h "$(dirname "$own_temp")"
