name: Build Release

on:
  # Automatically build and publish when a version tag is pushed.
  push:
    tags:
      - 'v*'

  # Also allow manual test runs from the Actions page.
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            python3 \
            libevent-dev zlib1g-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            libsodium-dev \
            libboost-dev \
            libsqlite3-dev \
            libdb++-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            qtwayland5 \
            libqrencode-dev \
            librsvg2-bin \
            imagemagick

      - name: Install pinned SV2 Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DBUILD_GUI=ON -DBUILD_SV2=ON \
            -DWITH_BDB=ON \
            -DWARN_INCOMPATIBLE_BDB=OFF \
            -DWITH_MINIUPNPC=ON \
            -DWITH_ZMQ=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF

      - name: Build
        run: |
          cmake --build build \
            --config "${BUILD_TYPE}" \
            -j "$(nproc)"

      - name: Show binaries
        run: |
          find build/bin -maxdepth 2 -type f -print

      - name: Prepare package
        shell: bash
        run: |
          VERSION="$(sed -n 's/^#define CLIENT_VERSION_STRING "\(.*\)"/\1/p' build/src/bitcoin-build-config.h)"
          test -n "${VERSION}"
          PACKAGE="bitcoin-purity-${VERSION}-x86_64-linux-gnu"
          echo "PACKAGE=${PACKAGE}" >> "$GITHUB_ENV"

          mkdir -p "release/${PACKAGE}/bin"

          find build/bin -maxdepth 1 -type f -executable \
            -exec cp -v {} "release/${PACKAGE}/bin/" \;

          cp -v README.md "release/${PACKAGE}/" 2>/dev/null || true
          cp -v COPYING "release/${PACKAGE}/" 2>/dev/null || true

          tar \
            -C release \
            -czf "${PACKAGE}.tar.gz" \
            "${PACKAGE}"

      - name: Verify extracted release binaries and GUI
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/release-extracted"
          tar -xzf "${PACKAGE}.tar.gz" -C "$RUNNER_TEMP/release-extracted"
          export BITCOIND="$RUNNER_TEMP/release-extracted/$PACKAGE/bin/bitcoind"
          export BITCOINCLI="$RUNNER_TEMP/release-extracted/$PACKAGE/bin/bitcoin-cli"
          mkdir "$RUNNER_TEMP/release-version"
          "$BITCOIND" -datadir="$RUNNER_TEMP/release-version" -nosettings -version
          "$BITCOINCLI" -datadir="$RUNNER_TEMP/release-version" -version
          python3 test/functional/feature_ipc_gui.py --configfile="$PWD/build/test/config.ini" --cachedir="$RUNNER_TEMP/package-cache" --gui-binary="$RUNNER_TEMP/release-extracted/$PACKAGE/bin/bitcoin-qt" --portseed=761

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: bitcoin-purity-*.tar.gz
          if-no-files-found: error


