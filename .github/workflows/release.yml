  # ============================================================
  # Windows x64
  # ============================================================
  windows-x86_64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      PYTHONUTF8: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Visual Studio Developer Prompt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswherePath -latest -property installationPath

          $cmd = "`"$installationPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -no_logo && set"

          cmd.exe /s /c $cmd | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              "$name=$value" | Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
            }
          }
          
      - name: Configure vcpkg compatibility
        shell: pwsh
        run: |
          "CMAKE_POLICY_VERSION_MINIMUM=3.5" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install rsvg-convert
        shell: pwsh
        run: |
          choco install msys2 -y --no-progress

          C:\tools\msys64\usr\bin\bash.exe -lc "
            pacman -Sy --noconfirm &&
            pacman -S --noconfirm mingw-w64-x86_64-librsvg
          "

          "C:\tools\msys64\mingw64\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
      
      - name: Verify rsvg-convert
        shell: pwsh
        run: |
          rsvg-convert --version      
      
      - name: Install pinned SV2 Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            --preset vs2022-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/depends/vcpkg-triplets" `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=OFF `
            -DBUILD_GUI=ON -DBUILD_SV2=ON `
            -DWITH_BDB=ON `
            -DWARN_INCOMPATIBLE_BDB=OFF `
            -DWITH_MINIUPNPC=ON `
            -DWITH_ZMQ=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_BENCH=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            -j $env:NUMBER_OF_PROCESSORS

      - name: Show binaries
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\bin

      - name: Prepare package
        shell: pwsh
        run: |
          $header = Get-Content -Raw "build\src\bitcoin-build-config.h"
          if ($header -notmatch '#define CLIENT_VERSION_STRING "([^"]+)"') {
              throw "Failed to read CLIENT_VERSION_STRING from bitcoin-build-config.h"
          }
          $version = $Matches[1]
          $package = "bitcoin-purity-$version-win64"
          "PACKAGE=$package" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $target = "release\$package\bin"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target | Out-Null

          Get-ChildItem `
            "build\bin\Release\*.exe" `
            -ErrorAction Stop |
            Copy-Item `
              -Destination $target

          if (Test-Path "README.md") {
              Copy-Item "README.md" "release\$package\"
          }

          if (Test-Path "COPYING") {
              Copy-Item "COPYING" "release\$package\"
          }

          Compress-Archive `
            -Path "release\$package" `
            -DestinationPath "$package.zip"

      - name: Verify extracted Windows binaries and GUI
        shell: pwsh
        run: |
          $archive = Get-Item bitcoin-purity-*.zip
          Expand-Archive -Path $archive.FullName -DestinationPath "$env:RUNNER_TEMP/release-extracted"
          $bin = "$env:RUNNER_TEMP/release-extracted/$env:PACKAGE/bin"
          $env:BITCOIND = "$bin/bitcoind.exe"
          $env:BITCOINCLI = "$bin/bitcoin-cli.exe"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/release-version" | Out-Null
          & $env:BITCOIND "-datadir=$env:RUNNER_TEMP/release-version" -nosettings -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BITCOINCLI "-datadir=$env:RUNNER_TEMP/release-version" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test/functional/feature_ipc_gui.py --configfile="$PWD/build/test/config.ini" --cachedir="$env:RUNNER_TEMP/package-cache" --gui-binary="$bin/bitcoin-qt.exe" --portseed=763
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: bitcoin-purity-*.zip
          if-no-files-found: error


  # ============================================================
  # Create final GitHub Release
  # ============================================================
  release:
    name: Publish GitHub Release

    needs:
      - linux-x86_64
      - linux-arm64
      - macos-arm64
      - windows-x86_64

    runs-on: ubuntu-24.04

    # Manual workflow runs build artifacts only.
    # Actual GitHub Release is created only for tags.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout source for manifest tooling
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            contrib/official-packages
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: |
          find release-artifacts \
            -maxdepth 1 \
            -type f \
            -print

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          files=(
            bitcoin-purity-*.tar.gz
            bitcoin-purity-*.zip
            Bitcoin-Purity-*.zip
            bitcoin-win64-setup-*.exe
          )
          if ((${#files[@]} == 0)); then
            echo "error: no release archives found for SHA256SUMS" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS

          cat SHA256SUMS

      - name: Generate releases manifest
        run: |
          mkdir manifest-artifacts
          for archive in release-artifacts/*; do
            case "$archive" in
              *apple-darwin.tar.gz|*/SHA256SUMS) continue ;;
            esac
            cp "$archive" manifest-artifacts/
          done
          python3 contrib/official-packages/generate-releases-manifest.py \
            --version "${GITHUB_REF_NAME}" \
            --artifacts-dir manifest-artifacts \
            --repo "${GITHUB_REPOSITORY}" \
            --output release-artifacts/releases.json

      - name: Sign releases manifest
        env:
          RELEASES_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASES_MANIFEST_SIGNING_KEY }}
        if: env.RELEASES_MANIFEST_SIGNING_KEY != ''
        run: |
          printf '%s\n' "${RELEASES_MANIFEST_SIGNING_KEY}" > /tmp/releases-sign.pem
          python3 contrib/official-packages/sign-manifest.py \
            --sign release-artifacts/releases.json \
            --key /tmp/releases-sign.pem
          rm -f /tmp/releases-sign.pem

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            release-artifacts/bitcoin-purity-*.tar.gz
            release-artifacts/bitcoin-purity-*.zip
            release-artifacts/Bitcoin-Purity-*.zip
            release-artifacts/bitcoin-win64-setup-*.exe
            release-artifacts/SHA256SUMS
            release-artifacts/releases.json
          )
          if ((${#files[@]} < 3)); then
            echo "error: expected release archives plus SHA256SUMS and releases.json" >&2
            ls -la release-artifacts >&2 || true
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Bitcoin Purity ${GITHUB_REF_NAME}" \
            --generate-notes
