  # ============================================================
  # macOS Apple Silicon
  # ============================================================
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Show AppleClang toolchain
        run: |
          clang --version

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet \
            coreutils \
            ninja \
            pkgconf \
            gnu-getopt \
            boost \
            libevent \
            curl \
            jansson \
            libsodium \
            miniupnpc \
            zeromq \
            qt@5 \
            qrencode \
            imagemagick \
            libicns \
            librsvg

      - name: Install pinned SV2 Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DBUILD_GUI=ON -DBUILD_SV2=ON \
            -DWITH_BDB=OFF \
            -DWITH_MINIUPNPC=ON \
            -DWITH_ZMQ=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF

      - name: Build
        run: |
          cmake --build build \
            --config "${BUILD_TYPE}" \
            -j "$(sysctl -n hw.logicalcpu)"

      - name: Show binaries
        run: |
          find build/bin -maxdepth 2 -type f -print

      - name: Verify deployment and build application archive
        run: |
          python3 contrib/macdeploy/test_macdeploy.py
          cmake --build build --target deploy -j 3
          cp build/Bitcoin-Purity-*.zip .

      - name: Prepare package
        shell: bash
        run: |
          VERSION="$(sed -n 's/^#define CLIENT_VERSION_STRING "\(.*\)"/\1/p' build/src/bitcoin-build-config.h)"
          test -n "${VERSION}"
          PACKAGE="bitcoin-purity-${VERSION}-arm64-apple-darwin"
          echo "PACKAGE=${PACKAGE}" >> "$GITHUB_ENV"

          mkdir -p "release/${PACKAGE}/bin"

          find build/bin -maxdepth 1 -type f -perm +111 \
            -exec cp -v {} "release/${PACKAGE}/bin/" \;

          cp -v README.md "release/${PACKAGE}/" 2>/dev/null || true
          cp -v COPYING "release/${PACKAGE}/" 2>/dev/null || true

          tar \
            -C release \
            -czf "${PACKAGE}.tar.gz" \
            "${PACKAGE}"

      - name: Verify extracted release binaries and GUI
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/release-extracted"
          tar -xzf "${PACKAGE}.tar.gz" -C "$RUNNER_TEMP/release-extracted"
          export BITCOIND="$RUNNER_TEMP/release-extracted/$PACKAGE/bin/bitcoind"
          export BITCOINCLI="$RUNNER_TEMP/release-extracted/$PACKAGE/bin/bitcoin-cli"
          mkdir "$RUNNER_TEMP/release-version"
          "$BITCOIND" -datadir="$RUNNER_TEMP/release-version" -nosettings -version
          "$BITCOINCLI" -datadir="$RUNNER_TEMP/release-version" -version
          ditto -x -k Bitcoin-Purity-*.zip "$RUNNER_TEMP/release-extracted"
          APP="$RUNNER_TEMP/release-extracted/Bitcoin Purity.app"
          codesign --verify --deep --strict "$APP"
          python3 test/functional/feature_ipc_gui.py --configfile="$PWD/build/test/config.ini" --cachedir="$RUNNER_TEMP/package-cache" --gui-binary="$APP/Contents/MacOS/Bitcoin-Qt" --gui-platform=cocoa --portseed=762

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            bitcoin-purity-*.tar.gz
            Bitcoin-Purity-*.zip
          if-no-files-found: error


