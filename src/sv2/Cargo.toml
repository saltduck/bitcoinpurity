[package]
name = "purity-sv2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
stratum-core = { git = "https://github.com/stratum-mining/stratum", rev = "d1d30f3e755b0a5108633e1be7012034a8caaecd", features = ["sv1", "translation"] }
tokio = { version = "1.44", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
key-utils = "1.2"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

[profile.release]
panic = "unwind"
